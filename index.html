  if (G.forceTradingDay !== undefined && G.forceTradingDay !== null) return Boolean(G.forceTradingDay);
  const d = new Date().getDay();
  return d >= 1 && d <= 5;
}
function recalc() {
  G.capital = G.coins;
  if (!G.peakCapital) G.peakCapital = Math.max(START_CAPITAL, G.coins);
  else G.peakCapital = Math.max(G.peakCapital, START_CAPITAL, G.coins);
}
function hpRatio() {
  const maxHp = Math.max(START_CAPITAL, G.peakCapital || START_CAPITAL);
  const curHp = Math.max(0, G.capital);
  if (maxHp <= 0) return 1.0;
  return Math.max(0.0, Math.min(1.0, curHp / maxHp));
}
function isDayFrozen(idx) {
  if (!G.days[idx]) return false;
  const ts = G.dayTimestamps[idx];
  if (!ts || ts <= 0) return false;
  const nowSec = Math.floor(Date.now() / 1000);
  return (nowSec - ts) >= 86400;
}
function checkMarginCall() {
  if (G.coins <= 0) {
    G.marginCallOpen = true;
    return true;
  }
  return false;
}
function formatNowStr() {
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())} ${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
}
function recoverMarginCall() {
  if (G.coins <= 0 && G.gems > 0) {
    // Lần cháy 1: Nạp 1,000 Kim Cương sang Vàng (hoặc toàn bộ KC còn lại nếu < 1,000)
    const amt = Math.min(1000, G.gems);
    G.gems -= amt;
    G.coins = amt;
    G.capital = G.coins;
    G.peakCapital = Math.max(START_CAPITAL, G.coins);
    G.marginCallOpen = false;
    if (!G.convHistory) G.convHistory = [];
    G.convHistory.unshift({
      timestamp: Math.floor(Date.now() / 1000),
      timeStr: formatNowStr(),
      fromCur: 1, // Kim Cương
      toCur: 0,   // Vàng
      amount: amt,
      vnd: amt * VND_RATE
    });
    play("buff");
    burst(W / 2, H / 2, GOLD, 35);
    floatText(`Hồi sinh tài khoản! +${amt.toLocaleString("en-US")} Xu Vàng sẵn sàng trade!`, W / 2, H / 2, GREEN);
    save();
  } else if (G.coins <= 0 && G.gems <= 0) {
    // Lần cháy 2: Rút vốn khẩn cấp $1,000 từ Ví Bank (ghi nhận nợ)
    G.gems = 0;
    G.withdrawnGems -= 1000;

    G.peakCapital = Math.max(START_CAPITAL, G.coins);
    G.marginCallOpen = false;

    G.convHistory.unshift({

      timeStr: formatNowStr(),
      fromCur: 2, // Bank
      toCur: 0,   // Vàng

      vnd: 1000 * VND_RATE

    play("buff");

    save();
  }
}
function nextGoal() { for (const m of MILESTONES) if (m[2] > G.capital) return m[2]; return GOAL; }

const KEYS = ["level", "xp", "coins", "gems", "withdrawnGems", "peakCapital", "days", "dayProfits", "dayTimestamps", "daysRew", "rules", "rulesRew", "bosses", "bossesRew", "disc", "discRew", "bonus", "claimed", "checklist", "convHistory"];

function getBackupVal(o, k) {
  if (o[k] !== undefined) return o[k];
  for (const [s, c] of Object.entries(SNAKE_TO_CAMEL)) {
    if (c === k && o[s] !== undefined) return o[s];
    if (s === k && o[c] !== undefined) return o[c];
  }
  return undefined;
}
function save() {
  try {
    const o = { version: 4 };
    KEYS.forEach(k => o[k] = G[k]);
    const str = JSON.stringify(o);
    localStorage.setItem(SAVE_KEY, str);
    try { sessionStorage.setItem(SAVE_KEY, str); } catch (_) {}
    try { localStorage.setItem("zero_hero_halodae_backup", str); } catch (_) {}
    if (G.cloudAutoSync && G.cloudUser && (G.cloudToken || G.cloudUid)) {
      triggerAutoCloudSave();
    }
  } catch (e) {
    console.warn("Storage save warning:", e);
  }
}

function loadFromData(o) {
  if (!o || (o.version !== 3 && o.version !== 4)) return false;
  KEYS.forEach(k => {
    try {
      const val = getBackupVal(o, k);
      if (val === undefined) return;
      if (k === "convHistory") {
        if (Array.isArray(val)) {
          G.convHistory = val.map(item => ({
            timestamp: Number(item.timestamp) || 0,
            timeStr: String(item.timeStr || item.time_str || ""),
            fromCur: Number(item.fromCur !== undefined ? item.fromCur : (item.from_cur !== undefined ? item.from_cur : 0)),
            toCur: Number(item.toCur !== undefined ? item.toCur : (item.to_cur !== undefined ? item.to_cur : 2)),
            amount: Number(item.amount) || 0,
            vnd: Number(item.vnd) || 0
          }));
        }
      } else if (Array.isArray(G[k])) {
        if (Array.isArray(val)) {
          const len = Math.min(val.length, G[k].length);
          for (let i = 0; i < len; i++) {
            if (k === "dayProfits" || k === "dayTimestamps") G[k][i] = Number(val[i]) || 0;
            else G[k][i] = Boolean(val[i]);
          }
        }
      } else if (typeof val === "number") {
        if (k !== "energy") G[k] = val;
      }
    } catch (errKey) {
      console.error("Load key error:", k, errKey);
    }
  });

  for (let i = 0; i < 1000; i++) {
    if (G.days[i] && (!G.dayTimestamps[i] || G.dayTimestamps[i] <= 0)) {
      G.dayTimestamps[i] = 1;
    }
  }

  if (o.version === 3) {
    let totalPnl = 0;
    G.days.forEach((d, i) => { if (d) totalPnl += G.dayProfits[i]; });
    G.coins = Math.max(1000, START_CAPITAL + totalPnl);
    G.gems = Math.max(0, G.gems);
  }

  G.capital = G.coins;
  recalc();
  checkMarginCall();
  return true;
}

function load() {
  try {
    let raw = localStorage.getItem(SAVE_KEY);
    if (!raw) {
      try { raw = sessionStorage.getItem(SAVE_KEY); } catch (_) {}
    }
    if (!raw) {
      try { raw = localStorage.getItem("zero_hero_halodae_backup"); } catch (_) {}
    }
    if (!raw) {
      try { raw = localStorage.getItem("zero_hero_halodae_v3"); } catch (_) {}
    }
    const o = JSON.parse(raw || "null");
    if (o) loadFromData(o);
  } catch (e) {
    console.error("Load general error:", e);
  }
}

function getCloudEmail(username) {
  const u = String(username || "").trim().toLowerCase();
  if (u.includes("@")) return u;
  let s = u.replace(/đ/g, "d").replace(/Đ/g, "d").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const clean = s.replace(/[^a-z0-9_.-]/g, "");
  return `${clean || "user"}@halodae.trade`;
}

    if (typeof firebase === "undefined") return false;

    if (!firebase.apps || !firebase.apps.length) {
      fbApp = firebase.initializeApp(G.firebaseConfig);
    } else {
      fbApp = firebase.app();
    }
    fbAuth = firebase.auth();
    fbDb = firebase.firestore();
    return true;
  } catch (e) {
    console.warn("Firebase init:", e);
    return false;
  }
}

function loadCloudSettings() {
  try {
    const rawCfg = localStorage.getItem("zero_hero_cloud_config");
    if (rawCfg) {
      const cfg = JSON.parse(rawCfg);
      G.cloudProvider = "firebase";
      if (cfg.autoSync !== undefined) G.cloudAutoSync = cfg.autoSync;
      if (cfg.firebase) {
        if (cfg.firebase.apiKey) G.firebaseConfig.apiKey = cfg.firebase.apiKey.trim();
        if (cfg.firebase.projectId) G.firebaseConfig.projectId = cfg.firebase.projectId.trim();
        if (cfg.firebase.authDomain) G.firebaseConfig.authDomain = cfg.firebase.authDomain.trim();
        if (cfg.firebase.storageBucket) G.firebaseConfig.storageBucket = cfg.firebase.storageBucket.trim();
        if (cfg.firebase.messagingSenderId) G.firebaseConfig.messagingSenderId = cfg.firebase.messagingSenderId.trim();
        if (cfg.firebase.appId) G.firebaseConfig.appId = cfg.firebase.appId.trim();
      }
    }
    const rawAuth = localStorage.getItem("zero_hero_cloud_auth");
    if (rawAuth) {
      const a = JSON.parse(rawAuth);
      if (a.username) G.cloudUser = a.username;
      if (a.password) G.cloudPass = a.password;
      if (a.token) G.cloudToken = a.token;
      if (a.uid) G.cloudUid = a.uid;
      if (a.lastSync) G.cloudLastSync = a.lastSync;
      if (G.cloudUser) G.cloudStatus = `Đã đăng nhập: ${G.cloudUser}`;
    }
    if (typeof fetch !== "undefined") {
      fetch("cloud_config.json")
        .then(r => r.ok ? r.json() : null)
        .then(cfg => {
          if (cfg && cfg.firebase && cfg.firebase.apiKey) {
            if (cfg.firebase.apiKey) G.firebaseConfig.apiKey = cfg.firebase.apiKey.trim();
            if (cfg.firebase.projectId) G.firebaseConfig.projectId = cfg.firebase.projectId.trim();
            saveCloudSettings();
          }
        }).catch(() => {});
    }
    initFirebaseClient();
  } catch (e) {
    console.warn("Cloud settings load:", e);
  }
}

function saveCloudSettings() {
  try {

      provider: "firebase",

    }

async function cloudSave(isSilent = false) {
  if (!G.cloudUser) {

    }

  }

  if (!G.cloudUid || !G.cloudToken) {

    }
    return false;
  }

  const o = { version: 4 };
  KEYS.forEach(k => o[k] = G[k]);
  const nowStr = formatNowStr();

  try {
    const url = `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(projectId)}/databases/(default)/documents/users/${encodeURIComponent(G.cloudUid)}`;
    const docBody = {
      fields: {
        payload: { stringValue: JSON.stringify(o) },
        username: { stringValue: G.cloudUser },
        updatedAt: { stringValue: nowStr }
      }
    };
    const resp = await fetch(url, {
      method: "PATCH",
      headers: {

        "Authorization": `Bearer ${G.cloudToken}`
      },

    });

    if (!resp.ok) {
      const errData = await resp.json().catch(() => ({}));

      try {
        await fbDb.collection("users").doc(G.cloudUid).set({
          payload: JSON.stringify(o),
          username: G.cloudUser,
          updatedAt: nowStr
        });
        G.cloudLastSync = nowStr;
        saveCloudSettings();
        if (!isSilent) {
          play("coin");
          burst(W / 2, 350, GREEN, 25);
          floatText(`ĐÃ LƯU TIẾN TRÌNH LÊN ĐÁM MÂY FIREBASE! (${nowStr})`, W / 2, 350, GREEN);
        }
        return true;
      } catch (sdkErr) {
        console.error("Firebase SDK save err:", sdkErr);
      }
    }
    console.error("Firebase save error:", err);
    if (!isSilent) {
      play("uncheck");
      let msg = `Lỗi lưu Firebase: ${err.message || err}`;
      if (err.message && err.message.includes("permission")) {
        msg = "Chưa mở quyền Firestore! Vào Firebase Console -> Firestore -> Rules -> đổi 'allow read, write: if true;' rồi bấm Publish.";
      }
      floatText(msg, W / 2, 350, RED);
    }
    return false;
  }

function promptFirebaseConfig() {
  const currentStr = JSON.stringify(G.firebaseConfig, null, 2);
  const val = prompt(
    "CẤU HÌNH GOOGLE FIREBASE:\n\n" +
    "Dán toàn bộ đoạn JSON / mã config từ Firebase Console, hoặc nhập trực tiếp:\n" +
    "- Project ID (VD: halodae-trading)\n" +
    "- Web API Key (VD: AIzaSy...)",
    currentStr
  );
  if (val !== null && val.trim()) {
    const trimmed = val.trim();
    try {
      if (trimmed.startsWith("{") && trimmed.endsWith("}")) {
        const parsed = JSON.parse(trimmed);
        if (parsed.apiKey) G.firebaseConfig.apiKey = parsed.apiKey.trim();
        if (parsed.projectId) G.firebaseConfig.projectId = parsed.projectId.trim();
        if (parsed.authDomain) G.firebaseConfig.authDomain = parsed.authDomain.trim();
        if (parsed.storageBucket) G.firebaseConfig.storageBucket = parsed.storageBucket.trim();
        if (parsed.messagingSenderId) G.firebaseConfig.messagingSenderId = parsed.messagingSenderId.trim();
        if (parsed.appId) G.firebaseConfig.appId = parsed.appId.trim();
      } else {
        const keyMatch = trimmed.match(/apiKey["']?\s*:\s*["']([^"']+)["']/i);
        const projMatch = trimmed.match(/projectId["']?\s*:\s*["']([^"']+)["']/i);
        if (keyMatch) G.firebaseConfig.apiKey = keyMatch[1].trim();
        if (projMatch) G.firebaseConfig.projectId = projMatch[1].trim();
        if (!keyMatch && !projMatch) {
          if (trimmed.startsWith("AIza")) {
            G.firebaseConfig.apiKey = trimmed;
          } else {
            G.firebaseConfig.projectId = trimmed;
          }
        }
      }
      saveCloudSettings();
      initFirebaseClient();
      play("buff");
      floatText("Đã cập nhật cấu hình Google Firebase thành công!", W / 2, 350, GREEN);
    } catch (e) {
      play("uncheck");
      floatText("Cấu hình không hợp lệ! Vui lòng kiểm tra lại JSON.", W / 2, 350, RED);
    }
  }
}

/* ---------- âm thanh (WebAudio) ---------- */
let actx = null;
function beep(freqs, dur, vol) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime, step = dur / freqs.length;
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = f; g.gain.setValueAtTime(vol, t0 + i * step);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + (i + 1) * step);
      o.connect(g); g.connect(actx.destination); o.start(t0 + i * step); o.stop(t0 + (i + 1) * step);
    });
  } catch (e) {}
}
const SND = { check: [659, 880, 1046], uncheck: [440, 330], coin: [988, 1318], level: [523, 659, 784, 1046, 1318], buff: [784, 988, 1175] };
const play = n => beep(SND[n], n === "level" ? 0.5 : 0.18, 0.12);

/* ---------- hiệu ứng đồ họa động ---------- */
function toRgba(color, a) {
  if (!color) return `rgba(255,255,255,${a})`;
  if (color.startsWith("rgba")) return color.replace(/[\d\.]+\)$/, `${a})`);
  if (color.startsWith("rgb(")) return color.replace("rgb(", "rgba(").replace(")", `,${a})`);
  if (color.startsWith("#")) {
    let c = color.slice(1);
    if (c.length === 3) c = c.split("").map(x => x + x).join("");
    const num = parseInt(c, 16);
    return `rgba(${(num >> 16) & 255},${(num >> 8) & 255},${num & 255},${a})`;
  }
  return color;
}

function drawSparkleStar(cx, cy, radius, color, alpha = 1, angle = 0) {
  if (radius <= 0.5 || alpha <= 0.01) return;
  const aClamped = Math.max(0, Math.min(1, alpha));
  const r = radius;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);

  // Quầng sáng tâm
  ctx.fillStyle = toRgba(color, aClamped * 0.35);
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.75, 0, Math.PI * 2);
  ctx.fill();

  // 4 cánh diamond chính
  ctx.fillStyle = toRgba(color, aClamped * 0.95);
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(0, r * 0.22);
  ctx.lineTo(-r, 0);
  ctx.lineTo(0, -r * 0.22);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(0, r);
  ctx.lineTo(r * 0.22, 0);
  ctx.lineTo(0, -r);
  ctx.lineTo(-r * 0.22, 0);
  ctx.closePath();
  ctx.fill();

  // Tâm trắng chói
  ctx.fillStyle = `rgba(255,255,255,${aClamped})`;
  ctx.beginPath();
  ctx.arc(0, 0, Math.max(1, r * 0.28), 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawGlowRect(r, color, maxAlpha = 0.15, radius = 6, glowSize = 4) {
  ctx.save();
  for (let i = 1; i <= glowSize; i++) {
    const a = maxAlpha * (1.0 - (i - 1) / glowSize);
    if (a <= 0.005) continue;
    ctx.strokeStyle = toRgba(color, a);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(r.x - i, r.y - i, r.w + i * 2, r.h + i * 2, radius + i);
    ctx.stroke();
  }
  ctx.restore();
}

function drawGlowCircle(cx, cy, radius, color, maxAlpha = 0.2, glowSize = 4) {
  ctx.save();
  for (let i = 1; i <= glowSize; i++) {
    const a = maxAlpha * (1.0 - (i - 1) / glowSize);
    if (a <= 0.005) continue;
    ctx.strokeStyle = toRgba(color, a);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, radius + i, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawElectricCrackle(cx, cy, length = 12, color = "#fff078") {
  const branches = 1 + Math.floor(Math.random() * 2);
  ctx.save();
  for (let b = 0; b < branches; b++) {
    let angle = Math.random() * Math.PI * 2;
    const segs = 3 + Math.floor(Math.random() * 2);
    let px = cx, py = cy;
    const dist = length / segs;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(px, py);
    for (let s = 0; s < segs; s++) {
      angle += (Math.random() - 0.5) * 1.6;
      px += Math.cos(angle) * dist;
      py += Math.sin(angle) * dist;
      ctx.lineTo(px, py);
    }
    ctx.stroke();
    // Core white line
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  ctx.restore();
}

function drawDeskMonitorGlow() {
  const pulse1 = (Math.sin(V.anim * 1.6) + 1.0) / 2.0;
  const pulse2 = (Math.sin(V.anim * 2.3 + 1.2) + 1.0) / 2.0;
  ctx.save();
  const g1 = ctx.createRadialGradient(320, 310, 10, 320, 310, 110);
  g1.addColorStop(0, `rgba(0,210,255,${(0.06 + 0.08 * pulse1).toFixed(3)})`);
  g1.addColorStop(1, "rgba(0,210,255,0)");
  ctx.fillStyle = g1;
  ctx.fillRect(210, 230, 220, 160);

  const g2 = ctx.createRadialGradient(470, 315, 10, 470, 315, 110);
  g2.addColorStop(0, `rgba(46,213,115,${(0.05 + 0.07 * pulse2).toFixed(3)})`);
  g2.addColorStop(1, "rgba(46,213,115,0)");
  ctx.fillStyle = g2;
  ctx.fillRect(360, 230, 220, 160);
  ctx.restore();
}

class ClickRipple {
  constructor(x, y, color = CYAN, maxRadius = 30) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.maxRadius = maxRadius;
    this.radius = 4;
    this.life = 18;
    this.age = 0;
  }
  update() {
    this.age++;
    this.radius += (this.maxRadius - 4) / this.life;
  }
  alive() {
    return this.age < this.life;
  }
  draw() {
    if (!this.alive() || this.radius < 2) return;
    const progress = this.age / this.life;
    const alpha = 0.85 * (1.0 - progress);
    const lw = Math.max(1, Math.round(3 * (1.0 - progress)));
    ctx.save();
    ctx.strokeStyle = toRgba(this.color, alpha);
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}
let ripples = [];
function burstRipple(x, y, color = CYAN, maxRadius = 32) {
  ripples.push(new ClickRipple(x, y, color, maxRadius));
}

const AMBIENT_COLORS = ["#ffd73c", "#00dcff", "#2ed573", "#be82ff", "#fff5dc"];
class AmbientParticle {
  constructor(randomY = true) {
    this.reset(randomY);
  }
  reset(randomY = true) {
    this.x = 20 + Math.random() * (W - 40);
    this.y = randomY ? (20 + Math.random() * (H - 40)) : (H + Math.random() * 20);
    this.vx = (Math.random() - 0.5) * 0.7;
    this.vy = -(0.35 + Math.random() * 0.5);
    this.size = 1.6 + Math.random() * 2.2;
    this.phase = Math.random() * Math.PI * 2;
    this.color = AMBIENT_COLORS[Math.floor(Math.random() * AMBIENT_COLORS.length)];
    this.isStar = Math.random() < 0.35;
    this.age = Math.floor(Math.random() * 100);
  }
  update() {
    this.age++;
    this.x += this.vx + Math.sin(this.age * 0.04 + this.phase) * 0.35;
    this.y += this.vy;
    if (this.y < -15 || this.x < -10 || this.x > W + 10) {
      this.reset(false);
    }
  }
  draw() {
    const twinkle = (Math.sin(this.age * 0.08 + this.phase) + 1.0) / 2.0;
    const alpha = (80 + 140 * twinkle) / 255;
    if (this.isStar && twinkle > 0.4) {
      drawSparkleStar(this.x, this.y, this.size * 1.5, this.color, alpha, this.phase + this.age * 0.04);
    } else {
      ctx.save();
      ctx.fillStyle = toRgba(this.color, alpha);
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
}

function executeConversion() {
  const amt = bankAmount();
  if (amt <= 0) {
    play("uncheck");
    floatText("Vui lòng nhập số lượng lớn hơn 0!", W / 2, 350, RED);
    return;
  }
  if (G.convFrom === G.convTo) {
    play("uncheck");
    floatText("Loại tiền nguồn và đích phải khác nhau!", W / 2, 350, RED);
    return;
  }
  const fromName = CURRENCY_NAMES[G.convFrom];
  const toName = CURRENCY_NAMES[G.convTo];

  // Kiểm tra số dư nguồn
  if (G.convFrom === 0) {
    if (G.coins < amt) {
      play("uncheck");
      floatText(`Không đủ Xu Vàng! Có ${G.coins.toLocaleString("en-US")} Vàng, cần ${amt.toLocaleString("en-US")} Vàng`, W / 2, 350, RED);
      return;
    }
  } else if (G.convFrom === 1) {
    if (G.gems < amt) {
      play("uncheck");
      floatText(`Không đủ Kim Cương! Có ${G.gems.toLocaleString("en-US")} KC, cần ${amt.toLocaleString("en-US")} KC`, W / 2, 350, RED);
      return;
    }
  } else if (G.convFrom === 2) {
    if (G.withdrawnGems < amt) {
      play("uncheck");
      floatText(`Không đủ số dư khả dụng trong Bank! Có $${G.withdrawnGems.toLocaleString("en-US")}, cần $${amt.toLocaleString("en-US")}`, W / 2, 350, RED);
      return;
    }
  }

  // Trừ nguồn
  if (G.convFrom === 0) {
    G.coins -= amt;
    G.peakCapital = Math.max(START_CAPITAL, G.coins);
  } else if (G.convFrom === 1) {
    G.gems -= amt;
  } else if (G.convFrom === 2) {
    G.withdrawnGems -= amt;
  }

  // Cộng đích
  if (G.convTo === 0) {
    G.coins += amt;
    G.peakCapital = Math.max(START_CAPITAL, G.coins);
  } else if (G.convTo === 1) G.gems += amt;
  else if (G.convTo === 2) G.withdrawnGems += amt;

  recalc();
  const vnd = amt * VND_RATE;
  if (!G.convHistory) G.convHistory = [];
  G.convHistory.unshift({
    timestamp: Math.floor(Date.now() / 1000),
    timeStr: formatNowStr(),
    fromCur: G.convFrom,
    toCur: G.convTo,
    amount: amt,
    vnd: vnd
  });
  G.convPage = 0;
  play("coin");
  floatText(`Đã chuyển ${amt.toLocaleString("en-US")} ${fromName} -> ${toName} (~ ${vnd.toLocaleString("en-US")} VNĐ)!`, W / 2, 350, GREEN);
  burst(W / 2, 350, G.convTo !== 0 ? GREEN : GOLD, 25);
  save();
  checkMarginCall();
}

function calcStats() {
  const logged = [];
  for (let i = 0; i < 1000; i++) {
    if (G.days[i]) logged.push({ day: i + 1, pnl: G.dayProfits[i] });
  }
  if (!logged.length) {
    return {
      totalTrades: 0, winDays: 0, lossDays: 0,
      winRate: 0, totalProfit: 0, totalLoss: 0, profitFactor: 0,
      maxDrawdownPct: 0, maxDrawdownDollar: 0,
      maxWinStreak: 0, maxLossStreak: 0,
      bestDay: 0, worstDay: 0, avgWin: 0, avgLoss: 0,
      equityPoints: [{ day: 0, eq: START_CAPITAL }]
    };
  }

  const totalTrades = logged.length;
  let winDays = 0, lossDays = 0, totalProfit = 0, totalLoss = 0;
  let bestDay = logged[0].pnl, worstDay = logged[0].pnl;
  logged.forEach(x => {
    if (x.pnl > 0) { winDays++; totalProfit += x.pnl; }
    else if (x.pnl < 0) { lossDays++; totalLoss += Math.abs(x.pnl); }
    if (x.pnl > bestDay) bestDay = x.pnl;
    if (x.pnl < worstDay) worstDay = x.pnl;
  });

  const winRate = totalTrades ? (winDays / totalTrades * 100) : 0;
  const profitFactor = totalLoss ? (totalProfit / totalLoss) : (totalProfit ? 99.9 : 0);

  let equity = START_CAPITAL, peak = START_CAPITAL;
  let maxDdDollar = 0, maxDdPct = 0;
  const equityPoints = [{ day: 0, eq: START_CAPITAL }];
  let curWin = 0, maxWin = 0, curLoss = 0, maxLoss = 0;

  logged.forEach(x => {
    equity += x.pnl;
    equityPoints.push({ day: x.day, eq: equity });
    if (equity > peak) peak = equity;
    const dd = peak - equity;
    if (dd > maxDdDollar) maxDdDollar = dd;
    if (peak > 0) {
      const ddPct = (dd / peak) * 100;
      if (ddPct > maxDdPct) maxDdPct = ddPct;
    }
    if (x.pnl > 0) { curWin++; curLoss = 0; if (curWin > maxWin) maxWin = curWin; }
    else if (x.pnl < 0) { curLoss++; curWin = 0; if (curLoss > maxLoss) maxLoss = curLoss; }
    else { curWin = 0; curLoss = 0; }
  });

  const avgWin = winDays ? Math.round(totalProfit / winDays) : 0;
  const avgLoss = lossDays ? Math.round(totalLoss / lossDays) : 0;

  return {
    totalTrades, winDays, lossDays, winRate,
    totalProfit, totalLoss, profitFactor,
    maxDrawdownPct: maxDdPct, maxDrawdownDollar: maxDdDollar,
    maxWinStreak: maxWin, maxLossStreak: maxLoss,
    bestDay, worstDay, avgWin, avgLoss,
    equityPoints
  };
}

    if (G.days[i]) runningCap += pnl;
    csv += `${i + 1},${defaultTargetForDay(i + 1)},${G.days[i] ? pnl : 0},${runningCap},${status}\n`;
  }
  if (G.convHistory && G.convHistory.length > 0) {
    csv += "\n\n--- NHẬT KÝ CHUYỂN ĐỔI TIỀN ---\nSTT,Ngày Giờ Chuyển,Từ Loại Tiền,Sang Loại Tiền,Số Lượng,Quy Đổi VNĐ\n";
    G.convHistory.forEach((c, idx) => {
      const fn = CURRENCY_NAMES[c.fromCur] || "Vàng";
      const tn = CURRENCY_NAMES[c.toCur] || "Bank";
      csv += `${idx + 1},${c.timeStr},${fn},${tn},${c.amount},${c.vnd}\n`;
    });
  }
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "halodae_trading_journal.csv";
  a.click();
  URL.revokeObjectURL(url);
  play("coin");
  floatText("Đã xuất file halodae_trading_journal.csv!", W / 2, 350, GREEN);
  burst(W / 2, 350, GREEN, 20);
}

function exportBackupJson() {
  const o = { version: 4 };
  KEYS.forEach(k => o[k] = G[k]);
  const blob = new Blob([JSON.stringify(o, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "halodae_backup.json";
  a.click();
  URL.revokeObjectURL(url);
  play("coin");
  floatText("Đã sao lưu file halodae_backup.json!", W / 2, 350, CYAN);
  burst(W / 2, 350, CYAN, 20);
}

function importBackupJson() {
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = ".json";
  inp.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const o = JSON.parse(ev.target.result);
        if (!o || (o.version !== 3 && o.version !== 4)) {
          play("uncheck");
          floatText("File sao lưu không hợp lệ!", W / 2, 350, RED);
          return;
        }
        KEYS.forEach(k => {
          try {
            const val = getBackupVal(o, k);
            if (val === undefined) return;
            if (k === "convHistory") {
              if (Array.isArray(val)) {
                G.convHistory = val.map(item => ({
                  timestamp: Number(item.timestamp) || 0,
                  timeStr: String(item.timeStr || item.time_str || ""),
                  fromCur: Number(item.fromCur !== undefined ? item.fromCur : (item.from_cur !== undefined ? item.from_cur : 0)),
                  toCur: Number(item.toCur !== undefined ? item.toCur : (item.to_cur !== undefined ? item.to_cur : 2)),
                  amount: Number(item.amount) || 0,
                  vnd: Number(item.vnd) || 0
                }));
              }
            } else if (Array.isArray(G[k])) {
              if (Array.isArray(val)) {
                const len = Math.min(val.length, G[k].length);
                for (let i = 0; i < len; i++) {
                  if (k === "dayProfits" || k === "dayTimestamps") G[k][i] = Number(val[i]) || 0;
                  else G[k][i] = Boolean(val[i]);
                }
              }
            } else if (typeof val === "number") {
              if (k !== "energy") G[k] = val;
            }
          } catch (errKey) {
            console.error("Import key error:", k, errKey);
          }
        });

        for (let i = 0; i < 1000; i++) {
          if (G.days[i] && (!G.dayTimestamps[i] || G.dayTimestamps[i] <= 0)) {
            G.dayTimestamps[i] = 1;
          }
        }

        if (o.version === 3) {
          let totalPnl = 0;
          G.days.forEach((d, i) => { if (d) totalPnl += G.dayProfits[i]; });
          G.coins = Math.max(1000, START_CAPITAL + totalPnl);
          G.gems = Math.max(0, G.gems);
        }

        G.capital = G.coins;
        recalc();
        checkMarginCall();
        V.cap = G.capital; V.xp = G.xp;
        save();
        play("level");
        floatText("ĐÃ KHÔI PHỤC DỮ LIỆU TỪ BẢN SAO LƯU!", W / 2, 350, GOLD);
        burst(W / 2, 350, GOLD, 30);
      } catch (err) {
        play("uncheck");
        floatText("Lỗi đọc file sao lưu!", W / 2, 350, RED);
      }
    };
    r.readAsText(file);
  };
  inp.click();
}

    return;
  }
  G.confirmReset = false;
  G.level = 1; G.xp = 0;
  G.coins = 1000; G.gems = 0; G.withdrawnGems = 0;
  G.days = Array(1000).fill(false);
  G.dayProfits = Array(1000).fill(0).map((_, i) => defaultTargetForDay(i + 1));
  G.daysRew = Array(1000).fill(false);
  G.dayTimestamps = Array(1000).fill(0);
  G.rules = Array(4).fill(false); G.rulesRew = Array(4).fill(false);

  G.bonus = Array(5).fill(false); G.claimed = Array(10).fill(false);

    if (hit(TAB_BACKUP_BTN, p)) { burstRipple(p.x, p.y, "#b46eff", 26); G.modalTab = 3; play("check"); return; }

    if (G.modalTab === 0) {
      if (hit(INPUT_BOX_RECT, p)) {
        burstRipple(p.x, p.y, GOLD, 22);
        const val = prompt("Nhập số tiền kiếm được hôm nay ($):", G.inputText);
        if (val !== null) G.inputText = val;
        return;
      }
      if (hit(BTN_SUBMIT_TODAY, p)) {
        if (!isTradingDay()) {
          burstRipple(p.x, p.y, "#8c8ca0", 28);
          play("uncheck");
          floatText("Cuối tuần thị trường đóng cửa! Hãy nghỉ ngơi kỷ luật để tái tạo năng lượng!", W / 2, 140, RED);

          G.modalTab = 3;
          return;
        }
        burstRipple(p.x, p.y, GREEN, 32);
        submitToday();
        return;
      }
      if (hit(BTN_REST_TODAY, p)) {
        if (!isTradingDay()) {
          burstRipple(p.x, p.y, "#8c8ca0", 28);
          play("uncheck");
          floatText("Cuối tuần thị trường đóng cửa! Hãy nghỉ ngơi kỷ luật để tái tạo năng lượng!", W / 2, 140, RED);
          return;
        }
        burstRipple(p.x, p.y, CYAN, 32);
        restToday();
        return;
      }
      if (hit(BTN_Q_BLOW, p)) { burstRipple(p.x, p.y, RED, 22); G.inputText = String(-Math.max(0, G.coins)); return; }
      if (hit(BTN_Q_P50, p)) { burstRipple(p.x, p.y, CYAN, 22); G.inputText = String((parseInt(G.inputText, 10) || 0) + 50); return; }
      if (hit(BTN_Q_P100, p)) { burstRipple(p.x, p.y, GREEN, 22); G.inputText = String((parseInt(G.inputText, 10) || 0) + 100); return; }
      if (hit(BTN_Q_P250, p)) { burstRipple(p.x, p.y, GOLD, 22); G.inputText = String((parseInt(G.inputText, 10) || 0) + 250); return; }
      if (hit(M_PREV, p)) { burstRipple(p.x, p.y, CYAN, 22); setPage(G.page - 1); return; }
      if (hit(M_NEXT, p)) { burstRipple(p.x, p.y, CYAN, 22); setPage(G.page + 1); return; }

      for (let k = 0; k < PAGE_SIZE; k++) {
        const r = dayCell(k), idx = G.page * PAGE_SIZE + k;

      }
    } else if (G.modalTab === 1) {
      // Chọn loại tiền "Từ"

        burstRipple(p.x, p.y, GOLD, 20);
        G.convFrom = 0;
        if (G.convTo === 0) G.convTo = 2;
        return;
      } else if (hit(BTN_CONV_FROM_1, p)) {
        burstRipple(p.x, p.y, CYAN, 20);
        G.convFrom = 1;
        if (G.convTo === 1) G.convTo = 0;
        return;
      } else if (hit(BTN_CONV_FROM_2, p)) {
        burstRipple(p.x, p.y, GREEN, 20);
        G.convFrom = 2;
        if (G.convTo === 2) G.convTo = 0;
        return;
      } else if (hit(BTN_CONV_SWAP, p)) {
        burstRipple(p.x, p.y, PURPLE, 20);
        const tmp = G.convFrom;
        G.convFrom = G.convTo;
        G.convTo = tmp;
        return;
      }
      // Chọn loại tiền "Sang"
      else if (hit(BTN_CONV_TO_0, p)) {

        G.convTo = 0;
        if (G.convFrom === 0) G.convFrom = 2;
        return;
      } else if (hit(BTN_CONV_TO_1, p)) {
        burstRipple(p.x, p.y, CYAN, 20);
        G.convTo = 1;
        if (G.convFrom === 1) G.convFrom = 0;
        return;
      } else if (hit(BTN_CONV_TO_2, p)) {
        burstRipple(p.x, p.y, GREEN, 20);
        G.convTo = 2;
        if (G.convFrom === 2) G.convFrom = 0;
        return;
      }

      if (hit(BANK_INP_RECT, p)) {
        burstRipple(p.x, p.y, CYAN, 22);

        if (val !== null) G.bankInputText = val.replace(/[^0-9]/g, "");
      } else if (hit(BTN_B_10, p)) { burstRipple(p.x, p.y, CYAN, 20); G.bankInputText = "10"; play("check"); }
      else if (hit(BTN_B_50, p)) { burstRipple(p.x, p.y, CYAN, 20); G.bankInputText = "50"; play("check"); }
      else if (hit(BTN_B_100, p)) { burstRipple(p.x, p.y, GREEN, 20); G.bankInputText = "100"; play("check"); }
      else if (hit(BTN_B_500, p)) { burstRipple(p.x, p.y, GREEN, 20); G.bankInputText = "500"; play("check"); }
      else if (hit(BTN_B_ALL, p)) {
        burstRipple(p.x, p.y, GOLD, 22);

        else G.bankInputText = String(Math.max(0, G.withdrawnGems));

        if (G.convPage < maxP) { G.convPage++; play("check"); }
      }

        if (hit(CHK_ROWS[i], p)) { burstRipple(p.x, p.y, GREEN, 24); toggleChecklist(i, p); return; }

      else if (hit(BTN_EXPORT_JSON, p)) { burstRipple(p.x, p.y, CYAN, 28); exportBackupJson(); }
      else if (hit(BTN_IMPORT_JSON, p)) { burstRipple(p.x, p.y, "#b482ff", 28); importBackupJson(); }
      else if (hit(BTN_RESET_DATA, p)) { burstRipple(p.x, p.y, RED, 28); resetData(); }
    } else if (G.modalTab === 4) {
      if (hit(CLOUD_USER_RECT, p)) {
        burstRipple(p.x, p.y, CYAN, 20);
        if (G.cloudUserFocused) {
          const val = prompt("Nhập Tên Đăng Nhập (Username):", G.cloudUser || "");
          if (val !== null) {
            G.cloudUser = val.trim().toLowerCase();
            saveCloudSettings();

  if (hit(AVATAR, p)) { burstRipple(p.x, p.y, GOLD, 28); floatText("Trader HaloDae - " + traderTitle(), AVATAR.cx, AVATAR.y, GOLD); return; }
  for (let i = 0; i < 10; i++) if (hit(mileRow(i), p) || hit(nodeRect(i), p)) { burstRipple(p.x, p.y, GOLD, 28); claimMilestone(i, p.x, p.y); return; }
  for (let i = 0; i < 4; i++) if (hit(ruleRow(i), p)) { burstRipple(p.x, p.y, GREEN, 24); toggleRule(i, p.x, p.y); return; }
  for (let i = 0; i < 3; i++) if (hit(bossRow(i), p)) { burstRipple(p.x, p.y, RED, 28); toggleBoss(i, p.x, p.y); return; }
  for (let i = 0; i < 4; i++) if (hit(discRow(i), p)) { burstRipple(p.x, p.y, CYAN, 26); toggleDiscipline(i, p.x, p.y); return; }
  for (let i = 0; i < 5; i++) if (hit(bonusRect(i), p)) { burstRipple(p.x, p.y, CYAN, 26); toggleBonus(i); return; }
}

function interactive(p) {

        Array.from({ length: PAGE_SIZE }, (_, k) => dayCell(k)).some(r => hit(r, p));

const FONT = '"Segoe UI", "Helvetica Neue", Arial, sans-serif';
const setFont = (size, bold = true) => { ctx.font = (bold ? "bold " : "") + size + "px " + FONT; };
function fitSize(text, maxW, size, bold = true, min = 8) {
  let s = size;
  while (s > min) { setFont(s, bold); if (ctx.measureText(text).width <= maxW) return s; s--; }
  return min;
}
function text(t, size, color, x, cy, align = "l", bold = true, shadow = true) {
  setFont(size, bold); ctx.textBaseline = "middle"; ctx.textAlign = align === "c" ? "center" : align === "r" ? "right" : "left";
  if (shadow) { ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillText(t, x + 1, cy + 1); }
  ctx.fillStyle = color; ctx.fillText(t, x, cy);
  return ctx.measureText(t).width;
}
function rrect(r, radius, fill, stroke, lw = 1) {
  ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, radius);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
const strokeBox = (r, radius, color, lw) => rrect(R(r.x + lw / 2, r.y + lw / 2, r.w - lw, r.h - lw), radius, null, color, lw);
function line(x1, y1, x2, y2, color, lw) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.stroke(); }
function compact(n, maxLen) {
  const s = n.toLocaleString("en-US");
  if (s.length <= maxLen) return s;
  return n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : (n / 1000).toFixed(1) + "k";
}
function checkbox(r, checked, hover, color, pulse = 0) {
  rrect(r, 3, "#0a0814");
  let border;
  if (checked) {
    border = color;
    drawGlowRect(r, color, 0.15, 3, 2);
  } else if (pulse > 0) {
    border = `rgb(255,${170 + 70 * pulse | 0},${40 + 60 * pulse | 0})`;
    drawGlowRect(r, border, 0.12 + 0.12 * pulse, 3, 3);
  } else {
    border = hover ? "#96b4dc" : "#5f6987";
  }
  strokeBox(r, 3, border, (checked || pulse > 0) ? 2 : 1);
  if (checked) {
    const p = 3;
    line(r.x + p, r.y + p, r.right - p - 1, r.bottom - p - 1, color, 2);
    line(r.x + p, r.bottom - p - 1, r.right - p - 1, r.y + p, color, 2);
  }
}
function bar(r, ratio, fill, back, border, anim = 0) {
  rrect(r, 4, back);
  ratio = Math.max(0, Math.min(1, ratio));
  const w = Math.floor(r.w * ratio);
  if (w > 0) {
    const fillW = Math.min(r.w, Math.max(w, 4));
    rrect(R(r.x, r.y, fillW, r.h), 4, fill);

    // Vệt bóng sáng phía trên (Bevel highlight)
    const topH = Math.max(2, Math.floor(r.h / 2) - 1);
    ctx.fillStyle = "rgba(255,255,255,0.18)";
    ctx.beginPath();
    ctx.roundRect(r.x, r.y, fillW, topH, [4, 4, 0, 0]);
    ctx.fill();

    // Luồng quét ánh sáng chuyển động (Scanning light sweep)
    if (anim > 0) {
      const swW = 22;
      const sweepX = r.x + Math.floor(((anim * 65) % (r.w + 70)) - 35);
      const clipL = Math.max(r.x, sweepX);
      const clipR = Math.min(r.x + fillW, sweepX + swW);
      if (clipR > clipL) {
        ctx.fillStyle = "rgba(255,255,255,0.3)";
        ctx.fillRect(clipL, r.y, clipR - clipL, r.h);
      }

      // Đầu dẫn phát sáng (Glowing leading tip)
      if (fillW < r.w) {
        const tipX = r.x + fillW;
        ctx.fillStyle = "rgba(255,255,255,0.55)";
        ctx.fillRect(tipX - 3, r.y - 1, 6, r.h + 2);
      }
    }
  }
  strokeBox(r, 4, border, 1);
}

  if (hover) {
    const topH = Math.max(2, Math.floor(r.h / 2));
    ctx.fillStyle = "rgba(255,255,255,0.12)";
    ctx.fillRect(r.x, r.y, r.w, topH);

  ctx.restore();

  text(label, fitSize(label, r.w - 10, size), WHITE, r.cx, r.cy, "c", true, false);

function drawMap(pulse) {
  // Tìm mốc mục tiêu kế tiếp chưa đạt
  let nextIdx = -1;
  for (let i = 0; i < MILESTONES.length; i++) {
    if (G.capital < MILESTONES[i][2]) { nextIdx = i; break; }
  }

  // 1. Vẽ các đường ống dẫn năng lượng (Conduit lines) nối giữa 10 mốc vốn
  for (let i = 0; i < MAP_PATH.length - 1; i++) {

    const [x1, y1] = MAP_PATH[i];
    const [x2, y2] = MAP_PATH[i + 1];
    const isCompleted = G.claimed[i + 1] || (G.capital >= MILESTONES[i + 1][2]);
    const isActive = (!isCompleted) && (nextIdx === i + 1);

    if (!isCompleted && !isActive) continue;

    const cometCol = isCompleted ? "#64ffa0" : GOLD;
    const speed = isCompleted ? 0.55 : 0.85;
    const t = (V.anim * speed + i * 0.35) % 1.0;
    const px = x1 + (x2 - x1) * t;
    const py = y1 + (y2 - y1) * t;

    // Đầu sao băng
    ctx.save();
    ctx.fillStyle = toRgba(cometCol, 0.86);
    ctx.beginPath();
    ctx.arc(px, py, isCompleted ? 3 : 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.98)";
    ctx.beginPath();
    ctx.arc(px, py, 2, 0, Math.PI * 2);
    ctx.fill();

    // Đuôi sao băng phát sáng (chỉ vẽ khi t >= tr để tránh nhảy vòng về đầu đoạn)
    for (const tr of [0.05, 0.10]) {
      if (t >= tr) {
        const tTr = t - tr;
        const tx = x1 + (x2 - x1) * tTr;
        const ty = y1 + (y2 - y1) * tTr;
        const tailA = 0.55 * (1.0 - tr / 0.12);
        ctx.fillStyle = toRgba(cometCol, tailA);
        ctx.beginPath();
        ctx.arc(tx, ty, 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  // 3. Vòng tròn radar định vị mốc mục tiêu kế tiếp (Dual Active Goal Beacon)
  if (nextIdx !== -1) {
    const nr = nodeRect(nextIdx);
    // Sóng 1 (Gold)
    const bP1 = (V.anim * 1.8) % 1.0;
    const bR1 = 12 + Math.round(14 * bP1);
    const bA1 = 0.74 * (1.0 - bP1);
    ctx.save();
    ctx.strokeStyle = toRgba(GOLD, bA1);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(nr.cx, nr.cy, bR1, 0, Math.PI * 2);
    ctx.stroke();

    // Sóng 2 (Cyan, lệch pha)
    const bP2 = (V.anim * 1.8 + 0.5) % 1.0;
    const bR2 = 12 + Math.round(14 * bP2);
    const bA2 = 0.55 * (1.0 - bP2);
    ctx.strokeStyle = toRgba(CYAN, bA2);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(nr.cx, nr.cy, bR2, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // 4. Vẽ 10 node mốc vốn với viền hào quang & huy hiệu hoàn thành
  for (let i = 0; i < 10; i++) {
    const r = nodeRect(i), hv = hit(r, mouse), ri = inflate(r, 2, 2);
    const target = MILESTONES[i][2];
    if (G.claimed[i]) {
      drawGlowRect(ri, GREEN, 0.11, 5, 3);
      strokeBox(ri, 5, GREEN, 2);
      // Huy hiệu hoàn thành dấu tích xanh lá (checkmark ✓)
      const cx = r.right - 2, cy = r.y + 2;
      ctx.beginPath();
      ctx.arc(cx, cy, 7, 0, Math.PI * 2);
      ctx.fillStyle = "#083c1e";
      ctx.fill();
      ctx.strokeStyle = GREEN;
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx - 4, cy);
      ctx.lineTo(cx - 1, cy + 3);
      ctx.lineTo(cx + 4, cy - 3);
      ctx.strokeStyle = GREEN;
      ctx.lineWidth = 2;
      ctx.stroke();
    } else if (G.capital >= target) {
      const claimP = (V.anim * 2.2) % 1.0;
      const claimR = 14 + Math.round(14 * claimP);
      const claimA = 0.82 * (1.0 - claimP);
      ctx.save();
      ctx.strokeStyle = `rgba(255,204,0,${claimA.toFixed(3)})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(r.cx, r.cy, claimR, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
      strokeBox(ri, 5, `rgb(255,${190 + 50 * pulse | 0},60)`, 2);
      drawSparkleStar(r.right - 2, r.y + 2, 4.0, GOLD, 0.94, V.anim * 2.0);
    }
    if (hv) {
      drawGlowRect(ri, WHITE, 0.16, 5, 3);
      strokeBox(ri, 5, WHITE, 1);
    }
  }
}

function drawModal() {
  if (V.modalAnim <= 0.01) return;

  // 1. Mờ nền bán trong suốt (dimming backdrop)
  ctx.save();
  ctx.fillStyle = `rgba(0,0,0,${(0.82 * V.modalAnim).toFixed(3)})`;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  // 2. Thẻ Modal với hiệu ứng nảy (pop scaling) và mờ dần (alpha fade)
  ctx.save();
  ctx.globalAlpha = V.modalAnim;
  const easeT = 1.0 - Math.pow(1.0 - V.modalAnim, 3);
  const scale = 0.93 + 0.07 * easeT;
  if (scale < 0.999) {
    ctx.translate(W / 2, H / 2);
    ctx.scale(scale, scale);
    ctx.translate(-W / 2, -H / 2);
  }
  drawModalCard();
  ctx.restore();
}

    const pId = (G.firebaseConfig && G.firebaseConfig.projectId) ? G.firebaseConfig.projectId : "(Chưa có Project ID - Bấm Cấu Hình)";
    const rawKey = (G.firebaseConfig && G.firebaseConfig.apiKey) ? G.firebaseConfig.apiKey : "";
    const keyDisp = rawKey.length > 12 ? (rawKey.slice(0, 8) + "..." + rawKey.slice(-4)) : (rawKey || "(Chưa có API Key)");
    text(`- Dự án (Project ID): ${pId}`, 10, TEXT_LIGHT, CLOUD_BOX_RECT.x + 14, CLOUD_BOX_RECT.y + 38, "l", false, false);
    text(`- Khóa API (API Key): ${keyDisp}`, 10, TEXT_LIGHT, CLOUD_BOX_RECT.x + 14, CLOUD_BOX_RECT.y + 58, "l", false, false);
    text("- Cơ sở dữ liệu: Google Cloud Firestore (Toàn cầu 0đ)", 9, MUTED, CLOUD_BOX_RECT.x + 14, CLOUD_BOX_RECT.y + 78, "l", false, false);
    text("- Đồng bộ thời gian thực: Tự động sao lưu tiến trình an toàn giữa iPhone & PC.", 9, GREEN, CLOUD_BOX_RECT.x + 14, CLOUD_BOX_RECT.y + 98, "l", false, false);
    const fbReady = Boolean(G.firebaseConfig && G.firebaseConfig.projectId && G.firebaseConfig.apiKey);
    const stReady = fbReady ? "✅ Sẵn sàng kết nối Google Firebase" : "⚠️ Chưa nhập API Key / Project ID (Bấm Cấu Hình)";
    text(`- Trạng thái: ${stReady}`, 9, fbReady ? "#38ef7d" : "#ffb446", CLOUD_BOX_RECT.x + 14, CLOUD_BOX_RECT.y + 118, "l", false, false);

    button(BTN_CONFIG_EDIT, "⚙️ Cấu Hình Firebase", "#b482ff", 11);
    button(BTN_CONFIG_TEST, "⚡ Kiểm Tra Kết Nối", CYAN, 11);
  }
}

const bg = new Image();
let bgReady = false;
bg.onload = () => { bgReady = true; };
bg.src = "assets/bg_clean.png";

function frame() {
  V.anim += 0.05;
  V.cap += (G.capital - V.cap) * 0.14;
  V.xp += (G.xp - V.xp) * 0.15;
  if (V.banner > 0) V.banner--;

  // Hiệu ứng mở/đóng modal mượt mà
  if (G.modal) {
    V.modalAnim = Math.min(1.0, V.modalAnim + 0.18);
  } else {
    V.modalAnim = Math.max(0.0, V.modalAnim - 0.22);
  }

  ambientParticles.forEach(ap => ap.update());

  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.96;
    p.vy += 0.13;
    p.angle = (p.angle || 0) + (p.rotSpeed || 0);
    p.age++;
    p.size = Math.max(0, p.size - 0.08);
  });
  particles = particles.filter(p => p.age < p.life && p.size > 0);

  ripples.forEach(r => r.update());
  ripples = ripples.filter(r => r.alive());

  floats.forEach(t => { t.y -= 1; t.age++; });
  floats = floats.filter(t => t.age < t.life);

  const pulse = (Math.sin(V.anim * 3) + 1) / 2;

  ctx.clearRect(0, 0, W, H);
  if (bgReady) ctx.drawImage(bg, 0, 0, W, H); else { ctx.fillStyle = "#0b0816"; ctx.fillRect(0, 0, W, H); }

  // Hạt nền cyber và bụi vàng trôi lơ lửng liên tục
  ambientParticles.forEach(ap => ap.draw());

  // Ánh sáng màn hình biểu đồ giao dịch hắt nhẹ ra phòng trade
  drawDeskMonitorGlow();

  drawResources();
  drawCharacter();
  drawDaily();
  drawMilestones(pulse);
  drawRules();
  drawBosses();
  drawDiscipline();
  drawBonus();
  drawFooterBanner(mouse, pulse);
  drawMap(pulse);

  // Sóng xung kích khi bấm chuột
  ripples.forEach(r => r.draw());

  // Hạt nổ ăn mừng đa dạng kiểu với góc xoay sống động
  particles.forEach(p => {
    const alpha = Math.max(0, 1 - p.age / p.life);
    if (p.kind === "star") {
      drawSparkleStar(p.x, p.y, p.size * 1.4, p.color, alpha, p.angle || 0);
    } else if (p.kind === "confetti") {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle || 0);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size, -p.size * 0.5, p.size * 2, p.size);
      ctx.restore();
    } else {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  });

  floats.forEach(t => {
    const al = 1 - t.age / t.life;
    setFont(14, true);
    const w = ctx.measureText(t.text).width, x = Math.max(4, Math.min(W - w - 4, t.x - w / 2));
    ctx.save();
    ctx.globalAlpha = al;
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillStyle = "rgba(0,0,0,.7)";
    ctx.fillText(t.text, x + 1, t.y + 1);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, x, t.y);
    ctx.restore();
  });

  drawBanner();

  if (G.modal || V.modalAnim > 0.01) {
    drawModal();
  } else {
    const t = tooltip(mouse);
    if (t) drawTooltip(t);
  }

  // Modal Cháy Tài Khoản (Margin Call Modal) hiển thị đè lên trên cùng khi kích hoạt
  if (G.marginCallOpen) {
    drawMarginCallModal();
  }

  cv.style.cursor = interactive(mouse) ? "pointer" : "default";
  requestAnimationFrame(frame);
}

function pos(e) {
  const b = cv.getBoundingClientRect();
  return { x: (e.clientX - b.left) * W / b.width, y: (e.clientY - b.top) * H / b.height };
}
let lastTouchTime = 0;
cv.addEventListener("mousemove", e => { mouse = pos(e); });
cv.addEventListener("mouseleave", () => { mouse = { x: -1, y: -1 }; });
cv.addEventListener("touchstart", e => {
  if (e.touches.length > 0) mouse = pos(e.touches[0]);
}, { passive: true });
cv.addEventListener("touchend", e => {
  lastTouchTime = Date.now();
  if (e.changedTouches.length > 0) {
    const p = pos(e.changedTouches[0]);
    mouse = p;
    click(p);
  }
  e.preventDefault();
}, { passive: false });
cv.addEventListener("click", e => {
  if (Date.now() - lastTouchTime < 450) return;
  click(pos(e));
});
cv.addEventListener("wheel", e => { if (G.modal && G.modalTab === 0 && !G.marginCallOpen) { e.preventDefault(); setPage(G.page + (e.deltaY > 0 ? 1 : -1)); } }, { passive: false });
window.addEventListener("keydown", e => {
  if (G.marginCallOpen) return;
  if (!G.modal) return;
  if (e.key === "Escape") { G.modal = false; return; }
  if (G.modalTab === 0 && (e.key === "ArrowLeft" || e.key === "PageUp")) setPage(G.page - 1);
  else if (G.modalTab === 0 && (e.key === "ArrowRight" || e.key === "PageDown")) setPage(G.page + 1);
  else if (G.modalTab === 4) {
    if (G.cloudUserFocused) {
      if (e.key === "Backspace") {
        e.preventDefault();
        G.cloudUser = G.cloudUser.slice(0, -1);
      } else if (e.key === "Tab" || e.key === "Enter") {
        e.preventDefault();
        G.cloudUserFocused = false;
        G.cloudPassFocused = true;
      } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey && G.cloudUser.length < 24) {
        if (!/\s/.test(e.key)) {
          e.preventDefault();
          G.cloudUser += e.key.toLowerCase();
        }
      }
    } else if (G.cloudPassFocused) {
      if (e.key === "Backspace") {
        e.preventDefault();
        G.cloudPass = G.cloudPass.slice(0, -1);
      } else if (e.key === "Enter") {
        e.preventDefault();
        cloudLogin(G.cloudUser, G.cloudPass);
      } else if (e.key === "Tab") {
        e.preventDefault();
        G.cloudPassFocused = false;
        G.cloudUserFocused = true;
      } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey && G.cloudPass.length < 32) {
        if (!/\s/.test(e.key)) {
          e.preventDefault();
          G.cloudPass += e.key;
        }
      }
    }
  }
});

// Lưu trữ an toàn tuyệt đối trên iOS Safari khi đổi app hoặc tắt tab
window.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") save(); });
window.addEventListener("pagehide", () => save());
window.addEventListener("beforeunload", () => save());

load(); recalc(); V.cap = G.capital; V.xp = G.xp;
loadCloudSettings();
syncInputWithNextDay();
const params = new URLSearchParams(window.location.search);
if (params.get("modal")) { G.modal = true; G.modalTab = 0; }
if (params.get("pocket") || params.get("bank")) { G.modal = true; G.modalTab = 1; }
if (params.get("stats")) { G.modal = true; G.modalTab = 2; }
if (params.get("backup")) { G.modal = true; G.modalTab = 3; }
if (params.get("cloud") || params.get("sync")) { G.modal = true; G.modalTab = 4; }
if (params.get("margin")) { G.coins = 0; G.gems = 1000; checkMarginCall(); }
if (params.get("margin2")) { G.coins = 0; G.gems = 0; checkMarginCall(); }
requestAnimationFrame(frame);
</script>
